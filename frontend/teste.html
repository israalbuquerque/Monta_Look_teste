<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button 
  type="button" 
  onclick="verificarCliente()" 
  class="btn-montalook d-block mx-auto mt-4">
  Descobrir Look Completo

</button>
  <script>
  // Simulação: isso viria do seu backend ou auth
  const usuario = {
    logado: true,
    cliente: false // true = cliente / false = não cliente
  };

  function verificarCliente() {
    if (!usuario.logado || !usuario.cliente) {
      abrirModalPlano();
      return;
    }

    // Se for cliente
    gerarSugestao();
  }

  function gerarSugestao() {
    alert("Gerando look completo ✨");
    // sua lógica real aqui
  }
</script>


<div id="modalPlano" class="modal-plano">
  <div class="modal-conteudo">
    <h2>✨ Acesso exclusivo</h2>
    <p>Para descobrir seu look completo, você precisa ter um plano ativo.</p>

    <a href="/planos" class="btn-plano">Ver planos</a>
    <button onclick="fecharModalPlano()" class="btn-fechar">Agora não</button>
  </div>
</div>

<style>
.modal-plano {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-conteudo {
  background: #fff;
  padding: 24px;
  border-radius: 12px;
  text-align: center;
  max-width: 360px;
  width: 90%;
}

.btn-plano {
  display: block;
  background: #000;
  color: #fff;
  padding: 12px;
  margin-top: 16px;
  text-decoration: none;
  border-radius: 8px;
}

.btn-fechar {
  margin-top: 10px;
  background: none;
  border: none;
  color: #777;
  cursor: pointer;
}</style>
<script>
  function abrirModalPlano() {
    document.getElementById("modalPlano").style.display = "flex";
  }

  function fecharModalPlano() {
    document.getElementById("modalPlano").style.display = "none";
  }
</script>


</body>
</html>
